<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-label="Git cheatsheet">
  <rect width="800" height="230" rx="14" fill="#111827"/>
  <text x="400" y="56" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="34" font-weight="bold" fill="#f9fafb">تقلب‌نامه‌ی فارسی گیت</text>
  <text x="400" y="88" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#9ca3af">git add · commit · branch · merge · rebase · stash</text>

  <g fill="none" stroke-linecap="round" stroke-width="4">
    <path d="M50 185 H750" stroke="#f97316"/>
    <path d="M260 185 C300 185 300 140 340 140 H520 C560 140 560 185 600 185" stroke="#38bdf8" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" begin="0.8s" dur="1.6s" fill="freeze"/>
    </path>
  </g>

  <g fill="#f97316">
    <circle cx="100" cy="185" r="9"/>
    <circle cx="180" cy="185" r="9"/>
    <circle cx="260" cy="185" r="9"/>
    <circle cx="600" cy="185" r="9"/>
    <circle cx="680" cy="185" r="9"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="380" cy="140" r="9" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
    </circle>
    <circle cx="480" cy="140" r="9" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.4s" fill="freeze"/>
    </circle>
  </g>
  <circle cx="680" cy="185" r="9" fill="none" stroke="#22c55e" stroke-width="3">
    <animate attributeName="r" values="9;18;9" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
